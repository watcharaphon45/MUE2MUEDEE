<label class="flex items-start gap-3 cursor-pointer group select-none" [class.opacity-60]="disabled" [class.cursor-not-allowed]="disabled">
  <div class="relative flex items-center justify-center mt-0.5">
    <input
      type="checkbox"
      [checked]="checked"
      [disabled]="disabled"
      (change)="onToggle($event)"
      (blur)="onBlur()"
      class="peer sr-only"
    />
    <div class="w-4 h-4 rounded-md border border-slate-300 bg-sky-50 peer-checked:bg-sky-600 peer-checked:border-sky-600 transition-colors flex items-center justify-center">
      @if (checked) {
        <span class="material-icons-outlined text-slate-800 text-[14px] leading-none font-bold">check</span>
      }
    </div>
  </div>

  @if (label || description) {
    <div class="space-y-0.5">
      @if (label) {
        <span class="text-xs font-medium text-slate-700 group-hover:text-sky-700 transition-colors block">
          {{ label }}
        </span>
      }
      @if (description) {
        <p class="text-[11px] text-slate-500 leading-normal">{{ description }}</p>
      }
    </div>
  }
</label>
