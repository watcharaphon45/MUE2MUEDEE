<div class="min-h-screen bg-sky-50 flex items-center justify-center p-4 sm:p-6 lg:p-8 selection:bg-sky-500 selection:text-white relative overflow-hidden">
  <!-- Ambient Glow Effects -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    <!-- Logo and Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex w-24 h-24 rounded-3xl overflow-hidden shadow-2xl shadow-amber-500/20 mb-4 bg-white p-2 border border-slate-200/80 items-center justify-center">
        <img src="/logo.png" alt="MUE2MUEDEE" class="w-full h-full object-contain" />
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-800">MUE2MUEDEE</h1>
      <p class="text-slate-500 text-sm mt-1">มือสองมือดี — ระบบบริหารร้านกล้องและสินค้ามือสอง</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white/80 backdrop-blur-xl border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <h2 class="text-lg font-semibold text-slate-800 mb-6 flex items-center gap-2">
        <span class="material-icons-outlined text-sky-600 text-xl">login</span>
        เข้าสู่ระบบ
      </h2>

      @if (errorMessage()) {
        <div class="mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-700 text-xs flex items-center gap-2">
          <span class="material-icons-outlined text-base">error_outline</span>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <app-textbox
          formControlName="usernameOrEmail"
          label="อีเมลหรือชื่อผู้ใช้"
          placeholder="เช่น owner@abccamera.com หรือ owner"
          icon="person"
          [required]="true"
          [errorMessage]="getErrorMessage('usernameOrEmail')"
        ></app-textbox>

        <app-textbox
          formControlName="password"
          label="รหัสผ่าน"
          type="password"
          placeholder="••••••••"
          icon="lock"
          [required]="true"
          [errorMessage]="getErrorMessage('password')"
        ></app-textbox>

        <button 
          type="submit" 
          [disabled]="loading() || loginForm.invalid"
          class="w-full mt-2 py-3 px-4 rounded-xl bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white font-medium text-sm shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2 transition-all cursor-pointer">
          @if (loading()) {
            <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            <span>กำลังเข้าสู่ระบบ...</span>
          } @else {
            <span>เข้าสู่ระบบ</span>
            <span class="material-icons-outlined text-base">arrow_forward</span>
          }
        </button>
      </form>

      <!-- Demo Credentials Quick Fill -->
      <div class="mt-6 pt-5 border-t border-slate-200">
        <div class="text-[11px] font-medium text-slate-500 mb-2.5 flex items-center gap-1.5">
          <span class="material-icons-outlined text-xs text-amber-600">tips_and_updates</span>
          ข้อมูลทดสอบระบบ (Demo Accounts):
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button 
            type="button"
            (click)="fillDemo('owner@abccamera.com', 'Admin1234!')"
            class="px-3 py-2 rounded-lg bg-slate-100/80 hover:bg-slate-200/80 border border-slate-300 text-left transition-colors cursor-pointer">
            <div class="text-xs font-semibold text-slate-700">Owner (เจ้าของ)</div>
            <div class="text-[10px] text-slate-500">สิทธิ์เต็มทุกโมดูล</div>
          </button>

          <button 
            type="button"
            (click)="fillDemo('staff@abccamera.com', 'Staff1234!')"
            class="px-3 py-2 rounded-lg bg-slate-100/80 hover:bg-slate-200/80 border border-slate-300 text-left transition-colors cursor-pointer">
            <div class="text-xs font-semibold text-slate-700">Staff (หน้าร้าน)</div>
            <div class="text-[10px] text-slate-500">ซ่อนต้นทุนและกำไร</div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
