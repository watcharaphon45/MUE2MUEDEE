<div class="space-y-1.5">
  @if (label) {
    <label class="block text-xs font-medium text-slate-600">
      {{ label }}
      @if (required) {
        <span class="text-rose-600 font-bold">*</span>
      }
    </label>
  }

  <div class="relative">
    @if (isCurrencyMode) {
      <div class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center gap-1 pointer-events-none select-none">
        <span class="text-xs font-semibold text-amber-600/90">{{ prefix }}</span>
      </div>
    } @else if (icon) {
      <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-lg pointer-events-none select-none">
        {{ icon }}
      </span>
    }

    <input
      type="text"
      inputmode="decimal"
      [value]="displayValue"
      [placeholder]="placeholder || (isCurrencyMode ? '0.00' : '0')"
      [disabled]="disabled"
      (input)="onInput($event)"
      (focus)="onFocus()"
      (blur)="onBlur()"
      [ngClass]="{
        'pl-8': isCurrencyMode,
        'pl-10': !isCurrencyMode && !!icon,
        'pl-4': !isCurrencyMode && !icon,
        'text-right pr-4 font-mono': isCurrencyMode,
        'border-rose-500 focus:border-rose-500 focus:ring-rose-500': !!errorMessage,
        'border-slate-300/80 focus:border-sky-500 focus:ring-sky-500': !errorMessage,
        'opacity-60 cursor-not-allowed bg-sky-50/40': disabled,
        'bg-white': !disabled
      }"
      class="w-full border rounded-xl pr-4 py-2.5 text-xs text-slate-800 placeholder:text-slate-500 focus:outline-none focus:ring-1 transition-colors"
    />
  </div>

  @if (errorMessage) {
    <p class="text-[11px] text-rose-600 flex items-center gap-1">
      <span class="material-icons-outlined text-xs">error</span>
      <span>{{ errorMessage }}</span>
    </p>
  } @else if (hint) {
    <p class="text-[11px] text-slate-500">{{ hint }}</p>
  }
</div>
