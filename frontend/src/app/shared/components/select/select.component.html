<div class="space-y-1.5">
  @if (label) {
    <label class="block text-xs font-medium text-slate-600">
      {{ label }}
      @if (required) {
        <span class="text-rose-600 font-bold">*</span>
      }
    </label>
  }

  <div class="relative">
    <select
      [value]="selectedValue"
      [disabled]="disabled"
      (change)="onChangeSelect($event)"
      (blur)="onBlur()"
      [ngClass]="{
        'border-rose-500 focus:border-rose-500 focus:ring-rose-500': !!errorMessage,
        'border-slate-300/80 focus:border-sky-500 focus:ring-sky-500': !errorMessage,
        'opacity-60 cursor-not-allowed bg-sky-50/40': disabled,
        'bg-white': !disabled
      }"
      class="w-full appearance-none border rounded-xl pl-4 pr-10 py-2.5 text-xs text-slate-800 focus:outline-none focus:ring-1 transition-colors cursor-pointer"
    >
      @if (placeholder) {
        <option value="" disabled [selected]="selectedValue === '' || selectedValue === null">
          {{ placeholder }}
        </option>
      }

      @for (opt of options; track opt.value) {
        <option [value]="opt.value" [disabled]="opt.disabled" class="bg-white text-slate-800 py-1">
          {{ opt.label }}
        </option>
      }
    </select>

    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500 flex items-center">
      <span class="material-icons-outlined text-base">expand_more</span>
    </div>
  </div>

  @if (errorMessage) {
    <p class="text-[11px] text-rose-600 flex items-center gap-1">
      <span class="material-icons-outlined text-xs">error</span>
      <span>{{ errorMessage }}</span>
    </p>
  } @else if (hint) {
    <p class="text-[11px] text-slate-500">{{ hint }}</p>
  }
</div>
